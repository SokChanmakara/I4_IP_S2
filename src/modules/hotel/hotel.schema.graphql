# GraphQL schema for Hotel

type Hotel {
  id: ID!
  name: String!
  address: String!
  phone: String!
}

type Query {
  hotels: [Hotel]
  hotel(id: ID!): Hotel
}

type Mutation {
  createHotel(name: String!, address: String!, phone: String!): Hotel
  updateHotel(id: ID!, name: String, address: String, phone: String): Hotel
  deleteHotel(id: ID!): Boolean
}
